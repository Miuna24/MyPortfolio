<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSGD 104 — Jubilee's Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dsgd100-body dsgd104-page">
    <div class="st1" aria-hidden="true">
        <main class="dsgd100-content dsgd104-content">
            <section class="portfolio-section portfolio-opening" aria-labelledby="mind-map-title">
                <div class="section-heading"><h2 id="mind-map-title">Mind Map</h2><span class="section-rule"></span></div>
                <figure class="feature-figure"><img src="DSGD104/1_MindMap.png" alt="DSGD 104 mind map" loading="eager"></figure>
            </section>

            <section class="portfolio-section" aria-labelledby="poster-title">
                <div class="section-heading"><h2 id="poster-title">Posters</h2><span class="section-rule"></span></div>
                <div class="portfolio-grid portfolio-grid--three portfolio-grid--posters">
                    <figure><img src="DSGD104/2_Poster1.png" alt="DSGD 104 poster 1" loading="lazy"></figure>
                    <figure><img src="DSGD104/2_Poster2.png" alt="DSGD 104 poster 2" loading="lazy"></figure>
                    <figure><img src="DSGD104/2_Poster3.png" alt="DSGD 104 poster 3" loading="lazy"></figure>
                </div>
            </section>

            <section class="portfolio-section portfolio-closing" aria-labelledby="brochure-title">
                <div class="section-heading"><h2 id="brochure-title">Brochure</h2><span class="section-rule"></span></div>
                <div class="portfolio-grid portfolio-grid--three portfolio-grid--brochure">
                    <figure><img src="DSGD104/3_Brochure1.jpeg" alt="Brochure page 1" loading="lazy"></figure>
                    <figure><img src="DSGD104/3_Brochure5.jpeg" alt="Brochure page 5" loading="lazy"></figure>
                    <figure><img src="DSGD104/3_Brochure6.jpeg" alt="Brochure page 6" loading="lazy"></figure>
                    <figure><img src="DSGD104/3_Brochure2.jpeg" alt="Brochure page 2" loading="lazy"></figure>
                    <figure><img src="DSGD104/3_Brochure3.jpeg" alt="Brochure page 3" loading="lazy"></figure>
                    <figure><img src="DSGD104/3_Brochure4.jpeg" alt="Brochure page 4" loading="lazy"></figure>
                </div>
            </section>

            <section class="portfolio-section" aria-labelledby="installation-title">
                <div class="section-heading"><h2 id="installation-title">3D Installation</h2><span class="section-rule"></span></div>
                <div class="portfolio-grid portfolio-grid--two portfolio-grid--installation">
                    <figure><img src="DSGD104/3D_Installation_Front.png" alt="3D installation front view" loading="lazy"></figure>
                    <figure><img src="DSGD104/3D_Installation_Side.png" alt="3D installation side view" loading="lazy"></figure>
                </div>
            </section>
        </main>
    </div>

    <div class="st2" aria-hidden="true">
        <img src="Portfolio_Buttons_Logo.png" alt="Logo Button" class="image2">
        <a href="index.html" aria-label="Works">
            <img src="Portfolio_Buttons_Works.png" alt="Works Button" class="image1">
        </a>
        <a href="about.html" aria-label="About">
            <img src="Portfolio_Buttons_About.png" alt="About Button" class="image">
        </a>
    </div>
</body>
</html>
