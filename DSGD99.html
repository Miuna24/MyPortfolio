<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSGD 99 — Jubillee's Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dsgd100-body">
    <div class="st1" aria-hidden="true">
        <main class="dsgd100-content dsgd99-content">
            <section class="portfolio-section portfolio-opening" aria-labelledby="problem-one-title">
                <div class="section-heading"><h2 id="problem-one-title">Problem 1</h2><span class="section-rule"></span></div>
                <figure class="feature-figure"><img src="DSGD99/DSGD99_Problem1.png" alt="DSGD 99 Problem 1" loading="eager"></figure>
            </section>

            <section class="portfolio-section" aria-labelledby="problem-two-title">
                <div class="section-heading"><h2 id="problem-two-title">Problem 2</h2><span class="section-rule"></span></div>
                <figure class="poster-figure"><img src="DSGD99/DsGD99_Problem2.png" alt="DSGD 99 Problem 2" loading="lazy"></figure>
            </section>

            <section class="portfolio-section" aria-labelledby="problem-three-title">
                <div class="section-heading"><h2 id="problem-three-title">Problem 3</h2><span class="section-rule"></span></div>
                <div class="portfolio-grid portfolio-grid--three">
                    <figure><img src="DSGD99/DSGD99_Problem3.jpg" alt="DSGD 99 Problem 3" loading="lazy"></figure>
                    <figure><img src="DSGD99/DSGD99_Problem3_2.png" alt="DSGD 99 Problem 3 variation 2" loading="lazy"></figure>
                    <figure><img src="DSGD99/DSGD99_Problem3_3.png" alt="DSGD 99 Problem 3 variation 3" loading="lazy"></figure>
                </div>
            </section>

            <section class="portfolio-section portfolio-closing" aria-labelledby="problem-four-title">
                <div class="section-heading"><h2 id="problem-four-title">Problem 4</h2><span class="section-rule"></span></div>
                <figure class="poster-figure"><img src="DSGD99/DSGD99_Problem4.jpg" alt="DSGD 99 Problem 4" loading="lazy"></figure>
            </section>
        </main>
    </div>

    <div class="st2" aria-hidden="true">
        <img src="Portfolio_Buttons_Logo.png" alt="Logo Button" class="image2">
        <a href="index.html" aria-label="Works">
            <img src="Portfolio_Buttons_Works.png" alt="Works Button" class="image1">
        </a>
        <a href="about.html" aria-label="About">
            <img src="Portfolio_Buttons_About.png" alt="About Button" class="image">
        </a>
    </div>
</body>
</html>
